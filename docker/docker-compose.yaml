version: "3.8"

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: gochat-mysql
    restart: always
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gochat
      MYSQL_USER: gochat
      MYSQL_PASSWORD: gochat
      # 设置为 true 则自动导入测试数据
      ENABLE_TEST_DATA: "true"
    volumes:
      - ./mysql/data:/var/lib/mysql
      # 01-init.sql: 表结构初始化（必需）
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      # 02-testdata.sql: 测试数据（可选，通过 ENABLE_TEST_DATA 控制）
      - ./testdata.sql:/docker-entrypoint-initdb.d/02-testdata.sql:ro
      # init.sh: 自定义初始化脚本
      - ./init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - gochat-network

  # Redis缓存和队列
  redis:
    image: redis:7-alpine
    container_name: gochat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - gochat-network

  # etcd服务发现
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: gochat-etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      ETCD_NAME: etcd0
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_INITIAL_CLUSTER: etcd0=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster
    networks:
      - gochat-network

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    container_name: gochat-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - gochat-network

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  gochat-network:
    driver: bridge
