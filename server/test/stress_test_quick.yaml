target:
  ws_addr: "ws://localhost:8081"
  api_addr: "http://localhost:8081"

safe_guard:
  max_cpu_percent: 75
  max_memory_percent: 75
  strategy: "warn_only"

server_profiles:
  - name: "2c4g"
    cpus: 2
    memory: "2GB"

layers:
  - name: connection
    enabled: false
  - name: private_chat
    enabled: false
  - name: group_chat
    enabled: true
    users: 200
    groups:
      - size: 10
        count: 5
    msg_interval: "3s"
    duration: "60s"
  - name: mixed
    enabled: false

metrics:
  output_dir: "reports"
  pprof: false
  snapshot_interval: "10s"
