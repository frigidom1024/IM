server:
  api_addr: ":8080"
  connect_addr: ":7000"
  logic_addr: ":7070"
  task_addr: ":7071"

mysql:
  host: localhost
  port: 3309
  user: gochat
  password: gochat
  database: gochat

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

etcd:
  endpoints:
    - localhost:2379

minio:
  endpoint: localhost:9000
  access_key_id: minioadmin
  secret_access_key: minioadmin123
  bucket: gochat
  use_ssl: false

auth:
  mode: "builtin"
  external_user_api: ""

jwt:
  secret: "gochat-secret-key-change-in-production"
  expire_time: 24 # 24小时

logger:
  level: "debug"  # debug/info/warn/error
  output: "stdout"