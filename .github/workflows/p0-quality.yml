name: p0-quality

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  compose-config:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate main compose
        run: docker compose -f gochat/docker-compose.yaml config --quiet

      - name: Validate integration compose
        run: docker compose -f examples/external-integration-demo/compose.yaml config --quiet
  integration-e2e:
    name: External integration E2E
    runs-on: ubuntu-latest
    needs: [go, compose-config]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start integration environment
        working-directory: examples/external-integration-demo
        run: docker compose -f compose.yaml up -d --build

      - name: Run external integration E2E
        working-directory: examples/external-integration-demo
        run: |
          node e2e.mjs
          node p1-e2e.mjs
          node relationships-e2e.mjs

      - name: Test standalone SDK consumer
        working-directory: examples/sdk-integration
        env:
          GOCHAT_URL: http://localhost:18080
          GOCHAT_WS_URL: ws://localhost:17000/ws
          GOCHAT_EXTERNAL_TOKEN: demo-alice
        run: go test -race -v ./...

      - name: Test public HTTP and WebSocket seams with isolated MySQL schemas
        env:
          GOCHAT_P1_TEST_DSN: 'gochat:gochat@tcp(127.0.0.1:13306)/gochat_p1_api_e2e?charset=utf8mb4&parseTime=True&loc=Local'
          GOCHAT_GROUP_TEST_DSN: 'gochat:gochat@tcp(127.0.0.1:13306)/gochat_groups_e2e?charset=utf8mb4&parseTime=True&loc=Local'
          GOCHAT_RELATION_TEST_DSN: 'gochat:gochat@tcp(127.0.0.1:13306)/gochat_relations_e2e?charset=utf8mb4&parseTime=True&loc=Local'
        run: |
          docker exec -e MYSQL_PWD=root gochat-integration-mysql mysql -uroot -e "CREATE DATABASE IF NOT EXISTS gochat_p1_api_e2e; CREATE DATABASE IF NOT EXISTS gochat_groups_e2e; GRANT ALL ON gochat_p1_api_e2e.* TO 'gochat'@'%'; GRANT ALL ON gochat_groups_e2e.* TO 'gochat'@'%';"
          docker exec -e MYSQL_PWD=root gochat-integration-mysql mysql -uroot -e "CREATE DATABASE IF NOT EXISTS gochat_relations_e2e; GRANT ALL ON gochat_relations_e2e.* TO 'gochat'@'%';"
          go test -race ./internal/api/... ./internal/connect/handler/...

      - name: Dump service logs on failure
        if: failure()
        working-directory: examples/external-integration-demo
        run: docker compose -f compose.yaml logs --no-color

      - name: Stop integration environment
        if: always()
        working-directory: examples/external-integration-demo
        run: docker compose -f compose.yaml down -v
