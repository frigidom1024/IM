services:
  mysql:
    image: mysql:8.0
    container_name: gochat-integration-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gochat
      MYSQL_USER: gochat
      MYSQL_PASSWORD: gochat
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../gochat/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../../gochat/mysql/migrations/003_p1_conversations_media.sql:/docker-entrypoint-initdb.d/03-p1.sql:ro
      - ../../gochat/mysql/migrations/004_p1_groups.sql:/docker-entrypoint-initdb.d/04-p1.sql:ro
      - ../../gochat/mysql/migrations/005_relationships_applications.sql:/docker-entrypoint-initdb.d/05-relations.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The auth/chat E2E only needs the MinIO client to initialize a bucket.
  # Use the local S3-compatible stub so the test does not depend on a
  # third-party MinIO registry mirror.
  object-store:
    build:
      context: ../..
      dockerfile: examples/external-integration-demo/Dockerfile
    container_name: gochat-integration-object-store
    environment:
      MODE: s3
      PORT: "9000"
    ports:
      - "19000:9000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  external-app:
    build:
      context: ../..
      dockerfile: examples/external-integration-demo/Dockerfile
    container_name: gochat-integration-external-app
    environment:
      PORT: "8090"
    ports:
      - "18090:8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  gochat:
    image: gochat-integration-server:local
    container_name: gochat-integration-gochat
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      object-store:
        condition: service_healthy
      external-app:
        condition: service_healthy
    ports:
      - "18080:8080"
      - "17000:7000"
    volumes:
      - ./config.yaml:/app/internal/config/config-dev.yaml:ro
      - uploads-data:/app/uploads

volumes:
  mysql-data:
  uploads-data:
