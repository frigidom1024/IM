environment: development
cors:
  allowed_origins:
    - http://localhost:3000
server:
  api_addr: ":8080"
  connect_addr: ":7000"
  logic_addr: ":7070"
  task_addr: ":7071"

mysql:
  host: mysql
  port: 3306
  user: gochat
  password: gochat
  database: gochat

redis:
  host: redis
  port: 6379
  password: ""
  db: 0

etcd:
  endpoints:
    - etcd:2379

minio:
  endpoint: minio:9000
  access_key_id: minioadmin
  secret_access_key: minioadmin123
  bucket: gochat
  use_ssl: false

jwt:
  secret: "gochat-secret-key-change-in-production"
  expire_time: 24 # 24小时

logger:
  level: "debug"  # debug/info/warn/error
  output: "stdout"